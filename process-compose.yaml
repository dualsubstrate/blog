# Hugo drafts+future, content-pipelines MCP, carousel-save.
# Start: go tool task serve (Hugo http://127.0.0.1:28492/)
# Requires process-compose, hugo, and go on PATH.
# User-level MCP config supplies PIPELINES_BIN / PIPELINES_DIR and credential refs.
# Go processes use `go tool wgo` so they rebuild when .go files change (MCP via scripts/serve-content-pipelines-mcp.sh).

version: "0.5"

log_level: info
log_length: 200

processes:
  hugo:
    command: hugo server --buildDrafts --buildFuture --bind 127.0.0.1 --port 28492
    availability:
      restart: on_failure
      backoff_seconds: 2
    shutdown:
      signal: 15
      timeout_seconds: 10

  carousel-save:
    command: ./scripts/serve-process.sh go tool wgo run ./cmd/carousel-save -addr 127.0.0.1:3848 -root .
    availability:
      restart: on_failure
      backoff_seconds: 2
    shutdown:
      signal: 15
      timeout_seconds: 5

  content-pipelines-mcp:
    command: ./scripts/serve-process.sh ./scripts/serve-content-pipelines-mcp.sh
    availability:
      restart: on_failure
      backoff_seconds: 2
    shutdown:
      signal: 15
      timeout_seconds: 10
