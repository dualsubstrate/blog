<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Publish calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/calendar/calendar.css">
</head>
<body>
  <main id="calendar-app" class="calendar-app"></main>
  <script type="module">
    const cacheBust = Date.now();
    document.querySelector('link[href="/calendar/calendar.css"]').href = `/calendar/calendar.css?v=${cacheBust}`;
    const { mountPublishCalendar } = await import(`/calendar/calendar.js?v=${cacheBust}`);
    mountPublishCalendar({
      root: document.getElementById('calendar-app'),
      dataUrl: '/calendar/publish-calendar.json',
      cacheBust,
    });
  </script>
</body>
</html>
