# type: sayings — explicación Por-Estas-Calles (partial sayings-project-about).
[sayingsProjectAboutTitle]
other = "¿Y esto?"

[sayingsProjectAboutP1]
other = "Esto es parte de un experimento: vamos contando cuántos dichos venezolanos logramos traducir al inglés hasta que el régimen actual impuesto cambie. Llámalo un cronómetro cultural para una época política."

[sayingsProjectAboutP2]
other = "En un mundo donde la cultura estadounidense se exporta y se adopta en todo el planeta, este proyecto «devuelve la exportación» con sabiduría callejera venezolana, como una pequeña contribución a un intercambio cultural más equilibrado."

# type: panel — explicación Tales from the Cube Farm (partial cows-project-about).
[cowsProjectAboutTitle]
other = "¿Y esto?"

[cowsProjectAboutBody]
other = "Esto es un experimento: contar las tiras de *Tales from the Cube Farm* antes de que los robots se sientan como un compañero más de oficina. Un cronómetro de caricatura para el fin de la era del «humano-como-robot».\n\nLa IA hace el trabajo creativo: el chiste, el concepto visual, el panel terminado. Los humanos solo curan. Ese intercambio es el punto.\n\nLa industrialización enseñó a la gente a actuar como máquinas primero, pero apenas perdemos nuestra naturaleza humana, para bien o para mal. Estas vacas-oficinistas de IA muestran cómo aprendimos a parecer máquinas en el trabajo. También muestran la naturaleza humana que nunca se fue del todo, antes de que los robots de verdad se instalen."

# Reptilocracy explainer (reptilocracy-project-about partial).
[reptilocracyProjectAboutTitle]
other = "¿Y ESTO?"

[reptilocracyProjectAboutBody]
other = "Esto es un experimento: contamos cuántas caricaturas hacen falta para que aceptemos de una vez que quienes tienen poder real deben demostrar que están mentalmente aptos para usarlo.\n\nAl retratar nuestros peores instintos de grupo usando animales, la serie lanza una pregunta obvia: ¿por qué seguimos entregando sociedades enteras a sistemas nerviosos sin filtro?\n\nEn un mundo donde la inestabilidad de un solo jefe puede hundir a toda una institución, Reptilocracia funciona como el diagnóstico ilustrado. La cura empieza con un paso concreto: la **[petición en Change.org](https://www.change.org/p/stronger-checks-and-balances-psychological-fitness-for-australia-s-top-leaders)** (*Stronger Checks and Balances: Psychological Fitness for Australia's Top Leaders*)."

[reptilocracyProjectAboutCtaTitle]
other = "Suma tu voz"

[reptilocracyProjectAboutCtaButton]
other = "Firma en Change.org"

# Pawtropolis (Under Fire) explainer (pawtropolis-project-about partial).
[pawtropolisProjectAboutTitle]
other = "¿Y ESTO?"

[pawtropolisProjectAboutBody]
other = "Pawtropolis (Under Fire) es una protesta silenciosa: la guerra nunca es normal, y el momento en que comienza a parecernos normal es el momento en que nos volvemos peligrosos.\n\nA la gente real la rebautizan con eufemismos: daño colateral, operaciones de seguridad, golpes de precisión. Las mascotas entrañables invierten ese truco: sientes por seres que no entienden por qué el cielo intenta matarlos.\n\nSi hacen falta gatos y perros para que la gente despierte, entonces eso es lo que se debe hacer."

# Everyone ❤️ Raymond explainer (raymond-project-about partial).
[raymondProjectAboutTitle]
other = "¿Y esto?"

[raymondProjectAboutBody]
other = "Este spinoff de *Cube-Cows* sigue a Raymond, el perro junior de *Just smaller*, recién salido de la uni, mientras entra a las travesuras corporativas con la libreta abierta.\n\nNo arregla el sistema. Toma notas. Cada tira es una jugada de oficina que ya no puede ignorar: salió de la uni, y de vuelta al preescolar.\n\nSale de *Tales from the Cube Farm* para que el nuevo tenga su propio cronómetro."

