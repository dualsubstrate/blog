# Build Hugo and deploy to the gh-pages branch.
#
# Preview: when *you* open or push commits to a PR (into main/master), this workflow builds and publishes
# a temporary preview URL. It does not create PRs or open branches for you—it only reacts to PR events.
#
# Repository Pages setting must be: Build and deployment → Deploy from a branch → gh-pages / (root).
# If you previously used "GitHub Actions" as the Pages source, switch to the branch above once this workflow is on the default branch.
#
# PR preview baseURL must use the same host as hugo.toml baseURL (custom domain). Project sites are served at the
# domain root there, while *.github.io/<repo>/ includes an extra path segment — a github.io-only baseURL breaks CSS
# and assets when opening previews at https://blog.dualsubstrate.com/pr-preview/pr-<n>/.
# Preview builds set HUGO_PREVIEW=1 → go tool task hugo uses -e preview + --buildFuture so upcoming posts appear in lists
# (production lists still hide future-dated rows via filter-pages-released-as-of-now).
#
# Scheduled deploy (single UTC cron; GitHub does not support IANA time zones in cron):
#   19:05 UTC daily ≈ 06:05 next calendar morning Australia/Sydney (AEDT ~UTC+11, AEST ~UTC+10; wall clock shifts by 1h across DST).
# For Hugo default (future-dated pages excluded), set each post `date` to an instant *before* this run in absolute time,
# e.g. 01:00:00 with +11:00 or +10:00 matching that calendar date, then merge to main before the run.
name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
    types:
      - opened
      - reopened
      - synchronize
      - closed
  workflow_dispatch:
  schedule:
    # Minute 5, hour 19 UTC, every day — see comment block above.
    - cron: '5 19 * * *'

# One in-flight run per PR (latest push wins). Production pushes do not cancel each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUGO_VERSION: "0.152.2"

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: github-pages
      url: https://blog.dualsubstrate.com/
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Hugo build
        uses: ./.github/actions/hugo-build
        with:
          hugo-version: ${{ env.HUGO_VERSION }}

      - name: Deploy production to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
          clean-exclude: pr-preview
          force: false

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
      pull-requests: write
    env:
      # Must match hugo.toml baseURL host; path is /pr-preview/pr-<n>/ on the custom domain (no /repo/ segment).
      PREVIEW_BASE_URL: https://blog.dualsubstrate.com/pr-preview/pr-${{ github.event.number }}/
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Hugo build
        if: github.event.action != 'closed'
        uses: ./.github/actions/hugo-build
        env:
          HUGO_PREVIEW: "1"
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          base-url: ${{ env.PREVIEW_BASE_URL }}

      - name: Remove legacy carousel.preview sidecars from preview slot
        if: github.event.action != 'closed'
        env:
          PREVIEW_DIR: pr-preview/pr-${{ github.event.number }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages --depth=1
          mapfile -t legacy < <(git ls-tree -r --name-only FETCH_HEAD -- "$PREVIEW_DIR" | grep '/carousel\.preview$' || true)
          if [ "${#legacy[@]}" -eq 0 ]; then exit 0; fi
          worktree=$(mktemp -d)
          git clone --depth=1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$worktree"
          cd "$worktree"
          for f in "${legacy[@]}"; do rm -f "$f"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && exit 0
          git commit -m "Remove legacy carousel.preview sidecars ($PREVIEW_DIR)"
          git push

      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: public
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          # Host only — pr-preview-action prepends https:// (see lib/main.sh: preview_url=https://$pages_base_url/...).
          # Using https:// here produced https://https://behaviorengineering.ai/... in the PR comment.
          pages-base-url: blog.dualsubstrate.com
          action: auto
          # Requires `pages: read` on GITHUB_TOKEN; otherwise GET .../pages/builds returns an error object and the
          # action's jq wait step fails with "Cannot index string with string \"commit\"".
          wait-for-pages-deployment: true
          comment: true
